services:
  postgres:
    image: postgres:17-alpine
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: strongpassword
    ports:
      - "5432:5432"
    volumes:
      - finance-postgres-data:/var/lib/postgresql/data
    networks:
      - finance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Finance.WebAPI/Dockerfile
      provenance: false
      sbom: false
      args:
        OTP_FRONTEND_BASE_URL: https://finos-staging.oldmonke.com/
        OTP_ACTIVE_WINDOW_MINUTES: 5
        OTP_REQUEST_HISTORY_LIMIT: 20
    container_name: finance-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      camelot-worker:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=finance_db;Username=finance_user;Password=strongpassword
      DataProtection__KeysPath: /var/app-data-protection-keys
      CamelotWorker__BaseUrl: http://camelot-worker:8000
      CamelotWorker__TimeoutSeconds: 60
      Cors__AllowedOrigins__0: http://localhost:3056
      Cors__AllowedOrigins__1: http://127.0.0.1:3056
      Auth__BootstrapUsers__0__Email: root@finance.local
      Auth__BootstrapUsers__0__Password: root
      Otp__FrontendBaseUrl: https://finos-staging.oldmonke.com/
      Otp__ActiveWindowMinutes: 5
      Otp__RequestHistoryLimit: 20
    ports:
      - "5133:8080"
    volumes:
      - finance-api-data-protection-keys:/var/app-data-protection-keys
    networks:
      - finance-network

  camelot-worker:
    build:
      context: .
      dockerfile: Finance.CamelotWorker/Dockerfile
      provenance: false
      sbom: false
    container_name: finance-camelot-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - finance-network

  spa:
    build:
      context: .
      dockerfile: Finance.WebAPI/finance-spa/Dockerfile
      provenance: false
      sbom: false
      args:
        NEXT_PUBLIC_FINANCE_API_BASE_URL: /api-proxy
        FINANCE_API_SERVER_BASE_URL: http://api:8080
    container_name: finance-spa
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      FINANCE_API_SERVER_BASE_URL: http://api:8080
      NEXT_PUBLIC_FINANCE_API_BASE_URL: /api-proxy
    ports:
      - "3056:3000"
    networks:
      - finance-network

volumes:
  finance-postgres-data:
  finance-api-data-protection-keys:

networks:
  finance-network:
    name: finance-network
    driver: bridge
